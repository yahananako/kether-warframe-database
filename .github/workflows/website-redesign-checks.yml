name: KETHER website redesign checks

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "data/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/website-redesign-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-check:
    name: TypeScript and Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Redesign source-contract checks
        run: node scripts/check-redesign-invariants.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Next.js production build
        run: npx next build
