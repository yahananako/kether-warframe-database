name: 驗證 KETHER iOS

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "android/assets/**"
      - "public/icon-*.png"
      - "public/home-ui-bg.png"
      - "public/home-hero-banner.png"
      - "public/kether-clan-logo.png"
      - "public/stat-card-silver-frame-filled.png"
      - "package.json"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - "android/assets/**"
      - "public/icon-*.png"
      - "public/home-ui-bg.png"
      - "public/home-hero-banner.png"
      - "public/kether-clan-logo.png"
      - "public/stat-card-silver-frame-filled.png"
      - "package.json"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kether-ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: iPhone／iPad 模擬器建置
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: 取得專案
        uses: actions/checkout@v4

      - name: 驗證共用資產與 iOS 專案
        run: |
          chmod +x ios/scripts/copy-web-assets.sh
          npm run test:ios

      - name: 顯示 Xcode 版本
        run: xcodebuild -version

      - name: 建置 KETHER iOS Simulator
        run: |
          xcodebuild \
            -project ios/KETHER.xcodeproj \
            -scheme KETHER \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: 封裝模擬器測試版
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/KETHER.app" \
            "$RUNNER_TEMP/KETHER-iOS-Simulator.zip"

      - name: 保存模擬器測試版
        uses: actions/upload-artifact@v4
        with:
          name: KETHER-iOS-Simulator
          path: ${{ runner.temp }}/KETHER-iOS-Simulator.zip
          retention-days: 14
          if-no-files-found: error
